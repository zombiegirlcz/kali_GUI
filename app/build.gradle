plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace = "com.linux_core.xlauncher"
    compileSdk = 36

    defaultConfig {
        applicationId = "com.linux_core.xlauncher"
        minSdk = 28
        targetSdk = 28
        versionCode = 1
        versionName = "0.1-foundation"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        // Debug and release share the same keystore so `adb install -r` works across builds.
        // NOTE: the Modal build volume currently holds a keystore whose key alias
        // is 'debugkey' (the de-facto signer used by prior builds). To switch to the
        // committed app/release.jks (alias 'releasekey'), delete /vol/keys/release.jks
        // from the kali-gui-build-data volume and set this alias back to 'releasekey'.
        create("release") {
            storeFile = file("release.jks")
            storePassword = System.getenv("KEYSTORE_PASSWORD") ?: "password123"
            keyAlias = System.getenv("KEY_ALIAS") ?: "debugkey"
            keyPassword = System.getenv("KEY_PASSWORD") ?: "password123"
        }
        getByName("debug") {
            storeFile = file("release.jks")
            storePassword = System.getenv("KEYSTORE_PASSWORD") ?: "password123"
            keyAlias = System.getenv("KEY_ALIAS") ?: "debugkey"
            keyPassword = System.getenv("KEY_PASSWORD") ?: "password123"
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            signingConfig = signingConfigs.getByName("release")
        }
        getByName("debug") {
            minifyEnabled = false
            signingConfig = signingConfigs.getByName("debug")
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation(libs.androidx.core.ktx)
    implementation(libs.androidx.lifecycle.runtime.ktx)
    implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0")

    // Pure-JVM unit tests for the com.linux_core.xlauncher.input layer.
    testImplementation("junit:junit:4.13.2")
}
